services:
  mysql: image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db

    volumes:
      - mysql-data:/var/lib/mysql

    ports:
      - "3306:3306"
  
  product-service: build: ./13_SpringRest
    ports:
      - "8082:8082"

    depends_on:
      - mysql
volumes: mysql-data:
